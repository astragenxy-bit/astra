version: "3.9"

# ═══════════════════════════════════════════════════════════
# WorkLearn Production Docker Compose
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ═══════════════════════════════════════════════════════════

services:

  postgres:
    image: postgres:16-alpine
    restart: always
    shm_size: '256mb'
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-worklearn}
      POSTGRES_USER:     ${POSTGRES_USER:-worklearn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: >
      postgres
        -c max_connections=100
        -c shared_buffers=2GB
        -c effective_cache_size=6GB
        -c work_mem=32MB
        -c maintenance_work_mem=512MB
        -c checkpoint_completion_target=0.9
        -c wal_buffers=16MB
        -c random_page_cost=1.1
        -c effective_io_concurrency=200
        -c log_min_duration_statement=200
        -c log_checkpoints=on
        -c log_connections=on
        -c log_disconnections=on
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/migrations:/docker-entrypoint-initdb.d:ro
      - ./docker/postgres-backup.sh:/usr/local/bin/backup.sh:ro
    deploy:
      resources:
        limits:   { memory: 3G }
        reservations: { memory: 2G }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-worklearn}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: always
    command: >
      redis-server
        --requirepass ${REDIS_PASSWORD}
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
        --appendonly yes
        --appendfsync everysec
        --hz 20
        --tcp-keepalive 60
        --timeout 300
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:   { memory: 768M }
        reservations: { memory: 512M }
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  elasticsearch:
    image: elasticsearch:8.13.0
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - bootstrap.memory_lock=true
    ulimits:
      memlock: { soft: -1, hard: -1 }
    volumes:
      - es_data:/usr/share/elasticsearch/data
    deploy:
      resources:
        limits:   { memory: 2G }
        reservations: { memory: 1.5G }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  minio:
    image: minio/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER:       "off"
    volumes:
      - minio_data:/data
    deploy:
      resources:
        limits:   { memory: 512M }
        reservations: { memory: 256M }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    restart: always
    depends_on:
      postgres:      { condition: service_healthy }
      redis:         { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
    environment:
      NODE_ENV:          production
      PORT:              4000
      DATABASE_URL:      postgresql://${POSTGRES_USER:-worklearn}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-worklearn}
      REDIS_URL:         redis://:${REDIS_PASSWORD}@redis:6379
      ELASTICSEARCH_URL: http://elasticsearch:9200
      JWT_SECRET:        ${JWT_SECRET}
      JWT_EXPIRES_IN:    ${JWT_EXPIRES_IN:-7d}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      MINIO_ENDPOINT:    minio
      MINIO_PORT:        9000
      MINIO_ACCESS_KEY:  ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY:  ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET:      ${MINIO_BUCKET:-worklearn}
      FPAY_MERCHANT_ID:  ${FPAY_MERCHANT_ID}
      FPAY_SECRET_KEY:   ${FPAY_SECRET_KEY}
      FPAY_API_URL:      ${FPAY_API_URL:-https://api.foxpay.vn/v1}
      CORS_ORIGIN:       ${CORS_ORIGIN:-https://worklearn.vn}
      EMAIL_HOST:        ${EMAIL_HOST}
      EMAIL_USER:        ${EMAIL_USER}
      EMAIL_PASS:        ${EMAIL_PASS}
      R2_ACCOUNT_ID:     ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY:     ${R2_ACCESS_KEY:-}
      R2_SECRET_KEY:     ${R2_SECRET_KEY:-}
      R2_PUBLIC_URL:     ${R2_PUBLIC_URL:-}
    deploy:
      replicas: 1
      resources:
        limits:   { memory: 1G, cpus: '2' }
        reservations: { memory: 512M }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context:    ./frontend
      dockerfile: Dockerfile
      target:     production
    restart: always
    depends_on:
      - backend
    deploy:
      resources:
        limits:   { memory: 256M }
        reservations: { memory: 128M }

  nginx:
    image: nginx:alpine
    restart: always
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot_data:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    deploy:
      resources:
        limits:   { memory: 256M }
        reservations: { memory: 64M }

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot_data:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done'"

volumes:
  postgres_data:
  redis_data:
  es_data:
  minio_data:
  certbot_data:
  certbot_certs:

networks:
  default:
    name: worklearn_prod
    driver: bridge
