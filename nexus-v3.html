<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus — Dòng Chảy Thông Tin</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Syne+Mono&display=swap');

*{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg:#0a0b0f;
  --surface:#11141d;
  --border:#1e2535;
  --free:#00e5a0;
  --free-dim:#00704e;
  --free-glow:rgba(0,229,160,.35);
  --nexus:#ff5533;
  --nexus-dim:#7a2918;
  --nexus-glow:rgba(255,85,51,.35);
  --warn:#ffb020;
  --text:#dde4f0;
  --muted:#4a5568;
  --font:'Syne',sans-serif;
  --mono:'Syne Mono',monospace;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font);
  height:100vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* ── TOP BAR ── */
.topbar{
  display:flex;align-items:center;gap:24px;
  padding:12px 28px;
  border-bottom:1px solid var(--border);
  background:var(--surface);
  flex-shrink:0;
  z-index:10;
}
.logo{
  font-size:15px;font-weight:800;letter-spacing:.06em;
  background:linear-gradient(135deg,var(--free),var(--nexus));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.topbar-title{
  font-size:11px;letter-spacing:.2em;color:var(--muted);
  text-transform:uppercase;
}

.scenario-btns{display:flex;gap:6px;margin-left:auto}
.scn-btn{
  font-family:var(--mono);
  font-size:10px;letter-spacing:.15em;
  padding:6px 14px;
  border:1px solid var(--border);
  background:transparent;
  color:var(--muted);cursor:pointer;
  text-transform:uppercase;
  transition:.15s;
  border-radius:2px;
}
.scn-btn:hover{border-color:var(--text);color:var(--text)}
.scn-btn.on{background:var(--text);color:var(--bg);border-color:var(--text)}

/* ── MAIN AREA ── */
.arena{
  flex:1;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0;
  min-height:0;
}

/* ── PANEL ── */
.panel{
  position:relative;
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  overflow:hidden;
}
.panel:last-child{border-right:none}

.panel-label{
  position:absolute;top:16px;left:20px;
  font-size:10px;letter-spacing:.25em;font-weight:700;
  text-transform:uppercase;z-index:5;
  display:flex;align-items:center;gap:8px;
}
.panel-label .dot{
  width:8px;height:8px;border-radius:50%;
  animation:dotpulse 2s infinite;
}
@keyframes dotpulse{0%,100%{opacity:1}50%{opacity:.4}}

canvas{display:block;width:100%;height:100%;flex:1}

/* ── STAT BAR ── */
.statbar{
  display:flex;gap:0;
  border-top:1px solid var(--border);
  flex-shrink:0;
  background:var(--surface);
}
.stat{
  flex:1;padding:10px 16px;
  border-right:1px solid var(--border);
  text-align:center;
}
.stat:last-child{border-right:none}
.stat-val{
  font-family:var(--mono);
  font-size:18px;font-weight:700;
  line-height:1;
  transition:color .3s;
}
.stat-lbl{
  font-size:8px;letter-spacing:.2em;color:var(--muted);
  text-transform:uppercase;margin-top:3px;
}
.stat-bar{height:2px;background:var(--border);margin-top:6px;border-radius:1px;overflow:hidden}
.stat-fill{height:100%;border-radius:1px;transition:width .4s ease}

.free-stat .stat-val{color:var(--free)}
.free-stat .stat-fill{background:var(--free)}
.nexus-stat .stat-val{color:var(--nexus)}
.nexus-stat .stat-fill{background:var(--nexus)}

/* ── MIDDLE DIVIDER LABEL ── */
.vs-badge{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:36px;height:36px;
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;letter-spacing:.05em;color:var(--muted);
  z-index:20;
  pointer-events:none;
}

/* ── NEXUS VALVE CONTROL ── */
.valve-wrap{
  position:absolute;bottom:80px;left:50%;
  transform:translateX(-50%);
  z-index:5;
  display:flex;flex-direction:column;align-items:center;gap:6px;
}
.valve-label{
  font-size:9px;letter-spacing:.2em;color:var(--nexus);
  text-transform:uppercase;text-align:center;
}
.valve-slider{
  -webkit-appearance:none;
  width:120px;height:4px;
  background:linear-gradient(to right,var(--nexus-dim),var(--nexus));
  border-radius:2px;outline:none;cursor:pointer;
}
.valve-slider::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:18px;height:18px;border-radius:50%;
  background:var(--nexus);
  border:2px solid var(--bg);
  box-shadow:0 0 8px var(--nexus-glow);
  cursor:pointer;
}
.valve-pct{
  font-family:var(--mono);
  font-size:14px;font-weight:700;color:var(--nexus);
}

/* ── BOTTOM EVENT LOG ── */
.eventlog{
  grid-column:1/-1;
  border-top:1px solid var(--border);
  background:var(--surface);
  padding:9px 28px;
  font-family:var(--mono);
  font-size:10px;letter-spacing:.06em;
  color:var(--muted);
  display:flex;align-items:center;gap:16px;
  flex-shrink:0;
  overflow:hidden;
}
.log-tag{
  color:var(--warn);font-weight:700;letter-spacing:.2em;
  flex-shrink:0;
}
#log-msg{color:var(--text);transition:opacity .3s}
#log-msg em{color:var(--nexus);font-style:normal;font-weight:700}
#log-msg b{color:var(--free);font-weight:700}

/* ── TOOLTIP ── */
.tip{
  position:absolute;
  background:var(--surface);
  border:1px solid var(--border);
  padding:8px 12px;
  font-size:10px;line-height:1.7;letter-spacing:.04em;
  pointer-events:none;
  opacity:0;transition:opacity .15s;
  z-index:30;min-width:160px;
  border-radius:2px;
}
.tip.show{opacity:1}

/* ── LEGEND ── */
.legend{
  position:absolute;bottom:78px;right:16px;
  display:flex;flex-direction:column;gap:5px;
  z-index:5;
}
.leg{display:flex;align-items:center;gap:7px;font-size:9px;letter-spacing:.1em;color:var(--muted)}
.leg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* scan lines */
body::before{
  content:'';position:fixed;inset:0;z-index:999;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.04) 2px,rgba(0,0,0,.04) 4px);
}
</style>
</head>

let scenario = 'info';
let valvePct = 35; // % của packet vượt qua nexus
let totalFreeDelivered = 0;
let totalNexusDelivered = 0;
let logIdx = 0, lastLog = 0;

// ═══════════════════════════════════════════
// CANVAS SETUP
// ═══════════════════════════════════════════
const cvF = document.getElementById('cv-free');
const cvN = document.getElementById('cv-nexus');
const ctxF = cvF.getContext('2d');
const ctxN = cvN.getContext('2d');

function resizeCanvases(){
  const pf = document.getElementById('pfree');
  const pn = document.getElementById('pnexus');
  const sb = document.getElementById('sb-free');

  cvF.width  = pf.offsetWidth;

// ═══════════════════════════════════════════
// NODE LAYOUT HELPERS
// ═══════════════════════════════════════════
function buildFreeNodes(W,H,sc){
  const nodes = {sources:[], sinks:[], hops:[]};
  const n = Math.min(sc.sources.length, 6);
  const m = Math.min(sc.sinks.length, 5);

  for(let i=0;i<n;i++){
    nodes.sources.push({
      x: W*.1 + (Math.random()-.5)*15,
      y: H*.1 + i*(H*.82/(n-1)) + (Math.random()-.5)*8,
      label: sc.sources[i], r:14
    });
  }
  for(let i=0;i<m;i++){
    nodes.sinks.push({
      x: W*.9 + (Math.random()-.5)*15,
      y: H*.15 + i*(H*.72/(m-1)) + (Math.random()-.5)*8,
      label: sc.sinks[i], r:14
    });
  }
  // A few mid relay hops
  for(let i=0;i<4;i++){
    nodes.hops.push({
      x: W*(.3+Math.random()*.4),
      y: H*(.15+Math.random()*.7),
      r:8
    });
  }
  return nodes;
}

function buildNexusNodes(W,H,sc){
  const nodes = {sources:[], sinks:[], nexus:null};
  const n = Math.min(sc.sources.length,6);
  const m = Math.min(sc.sinks.length,5);

  for(let i=0;i<n;i++){
    nodes.sources.push({
      x: W*.1, y: H*.1+i*(H*.82/(n-1)), label:sc.sources[i], r:14
    });
  }
  for(let i=0;i<m;i++){
    nodes.sinks.push({
      x: W*.9, y: H*.15+i*(H*.72/(m-1)), label:sc.sinks[i], r:14
    });
  }
  nodes.nexus = { x:W*.5, y:H*.5, r:40, label:sc.nexusName, color:sc.nexusColor, pulse:0, queue:0 };
  return nodes;
}

let freeNodes, nexusNodes;

// ═══════════════════════════════════════════
// PARTICLE CLASS
// ═══════════════════════════════════════════
class Particle{
  constructor(type, sx,sy, path, colors, opts={}){
    this.type = type;        // 'free' | 'nexus'
    this.x = sx; this.y = sy;
    this.path = path;        // [{x,y}]
    this.pi = 0;             // path index
    this.spd = 1.4 + Math.random()*.9;
    this.col = colors[Math.floor(Math.random()*colors.length)];
    this.r = 3.5 + Math.random()*2;
    this.alpha = 1;
    this.done = false;
    this.tail = [{x:sx,y:sy}];
    // nexus-specific
    this.blocked = opts.blocked||false;
    this.taxed   = opts.taxed||false;
    this.held    = opts.held||false;
    this.holdT   = 0;
    this.maxHold = opts.maxHold||0;
    this.phase   = 'travel'; // travel | hold | exit | fade
    if(this.blocked) this.col='#555';
    if(this.taxed)   this.col='#ffb020';
  }

  update(dt, spd){
    dt *= spd;

    if(this.phase==='fade'){
      this.alpha -= .04*spd;
      if(this.alpha<=0) this.done=true;
      return;
    }

    if(this.phase==='hold'){
      this.holdT += dt;
      // jiggle
      this.x += (Math.random()-.5)*.8;
      this.y += (Math.random()-.5)*.8;
      if(this.blocked || this.holdT>this.maxHold){
        if(this.blocked){ this.phase='fade'; return; }
        this.phase='exit';
      }
      return;
    }

    const tgt = this.path[this.pi];
    if(!tgt){ this.phase='fade'; return; }

    const dx=tgt.x-this.x, dy=tgt.y-this.y;
    const d=Math.sqrt(dx*dx+dy*dy);

    if(d<this.spd*dt*2){
      this.x=tgt.x; this.y=tgt.y;
      this.pi++;
      if(this.pi>=this.path.length){
        if(this.type==='nexus' && this.phase!=='exit'){
          // reached nexus center
          this.phase='hold';
          this.holdT=0;
        } else {
          this.phase='fade';
          totalFreeDelivered += (this.type==='free'?1:0);
          totalNexusDelivered += (this.type==='nexus'?1:0);
        }
        return;
      }
    } else {
      this.x += (dx/d)*this.spd*dt;
      this.y += (dy/d)*this.spd*dt;
    }

    this.tail.push({x:this.x,y:this.y});
    if(this.tail.length>12) this.tail.shift();
  }

  draw(ctx){
    if(this.done) return;
    const a = this.alpha;

    // Tail
    if(this.tail.length>2 && this.phase!=='hold'){
      for(let i=1;i<this.tail.length;i++){
        const t=i/this.tail.length;
        ctx.globalAlpha = a*t*.5;
        ctx.beginPath();
        ctx.arc(this.tail[i].x, this.tail[i].y, this.r*t*.6,0,Math.PI*2);
        ctx.fillStyle=this.col;
        ctx.fill();
      }
    }

    // Glow
    ctx.globalAlpha = a*.25;
    ctx.beginPath();
    ctx.arc(this.x,this.y,this.r*2.5,0,Math.PI*2);
    const g=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,this.r*2.5);
    g.addColorStop(0,this.col);
    g.addColorStop(1,'transparent');
    ctx.fillStyle=g; ctx.fill();

    // Core
    ctx.globalAlpha=a;
    ctx.beginPath();
    ctx.arc(this.x,this.y,this.r,0,Math.PI*2);
    ctx.fillStyle=this.col;
    ctx.fill();

    // Blocked X
    if(this.blocked && this.phase==='hold'){
      ctx.globalAlpha=a*.8;
      ctx.font=`bold ${this.r*2.5}px Syne`;
      ctx.fillStyle='#ff5533';
      ctx.textAlign='center';
      ctx.textBaseline='middle';
      ctx.fillText('✕',this.x,this.y-this.r*2.5);
    }

    ctx.globalAlpha=1;
  }
}

// ═══════════════════════════════════════════
// SIMULATION STATE
// ═══════════════════════════════════════════
let freeParticles=[], nexusParticles=[];
let spawnTimer=0;
let spawnInterval = .22; // seconds between spawns
let simTime=0;
let freeStats={flow:0,lat:0,div:0,cost:0};
let nexusStats={flow:0,lat:0,div:0,cost:0};
let smoothF={flow:10,lat:20,div:80,cost:2};
let smoothN={flow:5,lat:80,div:30,cost:25};

function spawnFree(sc){
  if(!freeNodes) return;
  const src = freeNodes.sources[Math.floor(Math.random()*freeNodes.sources.length)];
  const snk = freeNodes.sinks[Math.floor(Math.random()*freeNodes.sinks.length)];

  // Build path — sometimes go through a hop
  const useHop = Math.random()<.4 && freeNodes.hops.length>0;
  const path = [];
  if(useHop){
    const hop = freeNodes.hops[Math.floor(Math.random()*freeNodes.hops.length)];
    path.push({x:hop.x,y:hop.y});
  }
  path.push({x:snk.x,y:snk.y});

  freeParticles.push(new Particle('free',src.x,src.y,path,sc.particleColors));
}

function spawnNexus(sc){
  if(!nexusNodes||!nexusNodes.nexus) return;
  const src  = nexusNodes.sources[Math.floor(Math.random()*nexusNodes.sources.length)];
  const snk  = nexusNodes.sinks[Math.floor(Math.random()*nexusNodes.sinks.length)];
  const nx   = nexusNodes.nexus;

  const passes  = Math.random()*100 < valvePct;
  const blocked = !passes;
  const taxed   = passes && Math.random()<.4;

  const p = new Particle('nexus', src.x,src.y,
    [{x:nx.x,y:nx.y}], sc.particleColors,
    { blocked, taxed, maxHold: blocked?30:(40+Math.random()*60) }
  );

  // After hold, set exit path
  const origUpdate = p.update.bind(p);
  p.update = function(dt,spd){
    if(this.phase==='exit' && this.pi>=this.path.length){
      // inject exit path toward sink
      this.path = [{x:snk.x,y:snk.y}];
      this.pi   = 0;
    }
    origUpdate(dt,spd);
  };

  nexusParticles.push(p);
  if(nx) nx.queue = Math.min(nx.queue+1,20);
}

// ═══════════════════════════════════════════
// DRAW HELPERS
// ═══════════════════════════════════════════
function hex2rgba(hex,a){
  const r=parseInt(hex.slice(1,3),16);
  const g=parseInt(hex.slice(3,5),16);
  const b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

function drawFreeCanvas(ctx,W,H,sc){
  // BG
  ctx.fillStyle='#0a0b0f';
  ctx.fillRect(0,0,W,H);

  // Subtle grid
  ctx.strokeStyle='rgba(255,255,255,.03)';
  ctx.lineWidth=1;
  for(let x=0;x<W;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

  if(!freeNodes) return;

  // Edge connections (mesh)
  freeNodes.sources.forEach(s=>{
    freeNodes.sinks.forEach(k=>{
      ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(k.x,k.y);
      ctx.strokeStyle='rgba(0,229,160,.04)';ctx.lineWidth=1;ctx.stroke();
    });
    freeNodes.hops.forEach(h=>{
      ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(h.x,h.y);
      ctx.strokeStyle='rgba(0,229,160,.06)';ctx.lineWidth=.8;ctx.stroke();
    });
  });
  freeNodes.hops.forEach(h=>{
    freeNodes.sinks.forEach(k=>{
      ctx.beginPath();ctx.moveTo(h.x,h.y);ctx.lineTo(k.x,k.y);
      ctx.strokeStyle='rgba(0,229,160,.06)';ctx.lineWidth=.8;ctx.stroke();
    });
  });

  // Hop nodes
  freeNodes.hops.forEach(h=>{
    ctx.beginPath();ctx.arc(h.x,h.y,h.r,0,Math.PI*2);
    ctx.fillStyle='rgba(0,229,160,.08)';ctx.fill();
    ctx.strokeStyle='rgba(0,229,160,.3)';ctx.lineWidth=1;ctx.stroke();
  });

  // Source / sink nodes
  const drawNode=(n,col,label)=>{
    // glow
    ctx.beginPath();ctx.arc(n.x,n.y,n.r*2.2,0,Math.PI*2);
    ctx.fillStyle=hex2rgba(col,.12);ctx.fill();
    // ring
    ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,Math.PI*2);
    ctx.fillStyle=hex2rgba(col,.18);ctx.fill();
    ctx.strokeStyle=col;ctx.lineWidth=1.5;ctx.stroke();
    // dot
    ctx.beginPath();ctx.arc(n.x,n.y,4,0,Math.PI*2);
    ctx.fillStyle=col;ctx.fill();
    // label
    ctx.font='700 9px Syne';ctx.fillStyle=col;ctx.textAlign='center';
    ctx.fillText(label||n.label,n.x,n.y+n.r+11);
  };

  freeNodes.sources.forEach(n=>drawNode(n,'#00e5a0'));
  freeNodes.sinks.forEach(n=>drawNode(n,'#40c4ff'));

  // "FREE FLOW" watermark
  ctx.font='700 11px Syne Mono';
  ctx.fillStyle='rgba(0,229,160,.12)';
  ctx.textAlign='center';
  ctx.fillText('── MESH NETWORK ──',W/2,H*.5);

  // Particles
  freeParticles.forEach(p=>p.draw(ctx));

  // Live count
  const alive = freeParticles.filter(p=>!p.done).length;
  ctx.font='10px Syne Mono';ctx.fillStyle='rgba(0,229,160,.5)';ctx.textAlign='left';
  ctx.fillText(`${alive} luồng đang chạy`,12,H-12);
}

function drawNexusCanvas(ctx,W,H,sc){
  ctx.fillStyle='#0a0b0f';
  ctx.fillRect(0,0,W,H);

  // Grid
  ctx.strokeStyle='rgba(255,255,255,.03)';ctx.lineWidth=1;
  for(let x=0;x<W;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

  if(!nexusNodes) return;
  const nx=nexusNodes.nexus;

  // Spoke lines to nexus
  nexusNodes.sources.forEach(s=>{
    ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(nx.x,nx.y);
    ctx.strokeStyle='rgba(255,85,51,.12)';ctx.lineWidth=1.5;ctx.stroke();
  });
  nexusNodes.sinks.forEach(k=>{
    ctx.beginPath();ctx.moveTo(nx.x,nx.y);ctx.lineTo(k.x,k.y);
    ctx.strokeStyle='rgba(255,85,51,.12)';ctx.lineWidth=1.5;ctx.stroke();
  });

  // Nexus node
  nx.pulse += .04;
  // Outer pulse rings
  for(let i=0;i<3;i++){
    const pr=nx.r+20+i*22+Math.sin(nx.pulse+i*1.3)*8;
    const pa=.18-i*.05;
    ctx.beginPath();ctx.arc(nx.x,nx.y,pr,0,Math.PI*2);
    ctx.strokeStyle=`rgba(255,85,51,${pa})`;ctx.lineWidth=2;ctx.stroke();
  }
  // Main body
  const ngg=ctx.createRadialGradient(nx.x,nx.y,0,nx.x,nx.y,nx.r);
  ngg.addColorStop(0,'rgba(255,120,80,.4)');
  ngg.addColorStop(1,'rgba(180,30,10,.7)');
  ctx.beginPath();ctx.arc(nx.x,nx.y,nx.r,0,Math.PI*2);
  ctx.fillStyle=ngg;ctx.fill();
  ctx.strokeStyle='#ff5533';ctx.lineWidth=2;ctx.stroke();
  // Label
  const ll=nx.label.split('\n');
  ctx.font='700 10px Syne';ctx.fillStyle='#fff';ctx.textAlign='center';
  ll.forEach((l,i)=>ctx.fillText(l,nx.x,nx.y+(i-(ll.length-1)/2)*13+1));
  // Valve indicator arc
  const valveAngle=(valvePct/100)*Math.PI*2;
  ctx.beginPath();
  ctx.arc(nx.x,nx.y,nx.r+8,-Math.PI/2,-Math.PI/2+valveAngle);
  ctx.strokeStyle='#ff5533';ctx.lineWidth=3;ctx.stroke();
  ctx.beginPath();
  ctx.arc(nx.x,nx.y,nx.r+8,-Math.PI/2,-Math.PI/2+valveAngle+Math.PI*2-valveAngle);
  ctx.strokeStyle='rgba(255,85,51,.15)';ctx.lineWidth=3;ctx.stroke();
  // Queue badge
  const q=nexusParticles.filter(p=>p.phase==='hold'&&!p.done).length;
  if(q>0){
    ctx.beginPath();ctx.arc(nx.x+nx.r-2,nx.y-nx.r+2,12,0,Math.PI*2);
    ctx.fillStyle='#ffb020';ctx.fill();
    ctx.font='700 9px Syne';ctx.fillStyle='#000';ctx.textAlign='center';
    ctx.fillText(Math.min(q,99),nx.x+nx.r-2,nx.y-nx.r+6);
  }

  // Source / sink nodes
  const drawNode=(n,col)=>{
    ctx.beginPath();ctx.arc(n.x,n.y,n.r*2,0,Math.PI*2);
    ctx.fillStyle=hex2rgba(col,.1);ctx.fill();
    ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,Math.PI*2);
    ctx.fillStyle=hex2rgba(col,.15);ctx.fill();
    ctx.strokeStyle=col;ctx.lineWidth=1.5;ctx.stroke();
    ctx.beginPath();ctx.arc(n.x,n.y,4,0,Math.PI*2);
    ctx.fillStyle=col;ctx.fill();
    ctx.font='700 9px Syne';ctx.fillStyle=col;ctx.textAlign='center';
    ctx.fillText(n.label,n.x,n.y+n.r+11);
  };
  nexusNodes.sources.forEach(n=>drawNode(n,'#ff5533'));
  nexusNodes.sinks.forEach(n=>drawNode(n,'#ff8866'));

  // Valve pct overlay
  ctx.font='700 11px Syne Mono';
  ctx.fillStyle=`rgba(255,85,51,${.08+.12*(1-valvePct/100)})`;
  ctx.textAlign='center';
  ctx.fillText(`── BOTTLENECK: ${100-valvePct}% Bblocked ──`,W/2,H*.5);

  // Particles
  nexusParticles.forEach(p=>p.draw(ctx));

  // Stats overlay
  const blocked=nexusParticles.filter(p=>p.blocked&&!p.done).length;
  const held=nexusParticles.filter(p=>p.phase==='hold'&&!p.done&&!p.blocked).length;
  ctx.font='10px Syne Mono';ctx.fillStyle='rgba(255,85,51,.55)';ctx.textAlign='left';
  ctx.fillText(`${held} đang chờ  ·  ${blocked} bị chặn`,12,H-12);
}

// ═══════════════════════════════════════════
// STATS SMOOTHING
// ═══════════════════════════════════════════
function lerp(a,b,t){return a+(b-a)*t}

function updateStats(dt,sc){
  const spd=1.5;
  const alive_f=freeParticles.filter(p=>!p.done).length;
  const alive_n=nexusParticles.filter(p=>!p.done&&p.phase!=='hold').length;
  const base=sc.baseFree;

  const tf = Math.min(99, base.flow+alive_f*.4);
  const tn = Math.max(3, (valvePct/100)*(base.flow*.6)+alive_n*.3);
  smoothF.flow=lerp(smoothF.flow,tf,.05);
  smoothN.flow=lerp(smoothN.flow,tn,.05);

  smoothF.lat=lerp(smoothF.lat,base.lat+Math.random()*6,.08);
  smoothN.lat=lerp(smoothN.lat,base.lat*3.5+50*(1-valvePct/100)+Math.random()*20,.08);

  smoothF.div=lerp(smoothF.div,base.div+Math.random()*4,.05);
  smoothN.div=lerp(smoothN.div,base.div*(valvePct/100)*.5+Math.random()*8,.05);

  smoothF.cost=lerp(smoothF.cost,base.cost,.05);
  smoothN.cost=lerp(smoothN.cost,28-valvePct*.1+Math.random()*5,.05);

  const set=(id,val,bar,max)=>{
    const el=document.getElementById(id);
    const bl=document.getElementById(bar);
    if(el) el.textContent=Math.round(val)+(id.includes('cost')?'%':'');
    if(bl) bl.style.width=Math.min(100,(val/max)*100)+'%';
  };

  set('f-flow',smoothF.flow,'f-flow-b',100);
  set('f-lat', smoothF.lat, 'f-lat-b', 200);
  set('f-div', smoothF.div, 'f-div-b', 100);
  set('f-cost',smoothF.cost,'f-cost-b',50);

  set('n-flow',smoothN.flow,'n-flow-b',100);
  set('n-lat', smoothN.lat, 'n-lat-b', 200);
  set('n-div', smoothN.div, 'n-div-b', 100);
  set('n-cost',smoothN.cost,'n-cost-b',50);
}

// ═══════════════════════════════════════════
// SCENARIO SWITCH
// ═══════════════════════════════════════════
function setScenario(s){
  scenario=s;
  ['info','trade','social','money'].forEach(k=>{
    document.getElementById('s-'+k).className='scn-btn'+(k===s?' on':'');
  });
  freeParticles=[]; nexusParticles=[];
  totalFreeDelivered=0; totalNexusDelivered=0;
  spawnTimer=0;
  const sc=SCENARIOS[s];
  document.getElementById('free-title').textContent=sc.freeTitle;
  document.getElementById('nexus-title').textContent=sc.nexusTitle;
  resizeCanvases();
  freeNodes=buildFreeNodes(cvF.width,cvF.height,sc);
  nexusNodes=buildNexusNodes(cvN.width,cvN.height,sc);
}

function updateValve(v){
  valvePct=parseInt(v);
  document.getElementById('valve-pct').textContent=v;
}

// ═══════════════════════════════════════════
// LOG ROTATION
// ═══════════════════════════════════════════
function rotateLogs(t){
  if(t-lastLog<3){ return; }
  lastLog=t;
  const sc=SCENARIOS[scenario];
  const msg=sc.logs[logIdx%sc.logs.length];
  const el=document.getElementById('log-msg');
  el.style.opacity='0';
  setTimeout(()=>{ el.innerHTML=msg; el.style.opacity='1'; },200);
  logIdx++;
}

// ═══════════════════════════════════════════
// MAIN LOOP
// ═══════════════════════════════════════════
let last=0;
function loop(ts){
  const dt=Math.min((ts-last)/1000,.05);
  last=ts;
  simTime+=dt;

  const sc=SCENARIOS[scenario];

  // Spawn
  spawnTimer+=dt;
  if(spawnTimer>spawnInterval){
    spawnTimer=0;
    // spawn multiple
    for(let i=0;i<2;i++) spawnFree(sc);
    for(let i=0;i<2;i++) spawnNexus(sc);
  }

  // Update
  freeParticles.forEach(p=>p.update(dt*60,1));
  nexusParticles.forEach(p=>p.update(dt*60,1));

  // Trim done
  if(freeParticles.length>200)  freeParticles=freeParticles.filter(p=>!p.done).slice(-180);
  if(nexusParticles.length>200) nexusParticles=nexusParticles.filter(p=>!p.done).slice(-180);

  // Draw
  drawFreeCanvas(ctxF, cvF.width, cvF.height, sc);
  drawNexusCanvas(ctxN, cvN.width, cvN.height, sc);

  // Metrics
  updateStats(dt,sc);
  rotateLogs(simTime);

  requestAnimationFrame(loop);
}

// ═══════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════
window.addEventListener('resize',()=>{
  resizeCanvases();
  const sc=SCENARIOS[scenario];
  freeNodes=buildFreeNodes(cvF.width,cvF.height,sc);
  nexusNodes=buildNexusNodes(cvN.width,cvN.height,sc);
  freeParticles=[]; nexusParticles=[];
});

setScenario('info');
requestAnimationFrame(loop);
</script>
