version: "3.9"

services:
  # ── PostgreSQL Database ──────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: worklearn_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-worklearn}
      POSTGRES_USER:     ${POSTGRES_USER:-worklearn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-worklearn_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-worklearn}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis Cache + Queue ──────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: worklearn_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Elasticsearch Search Engine ──────────────────────────
  elasticsearch:
    image: elasticsearch:8.13.0
    container_name: worklearn_es
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ── MinIO (S3-compatible storage for videos/PDFs) ────────
  minio:
    image: minio/minio:latest
    container_name: worklearn_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ── Backend API (Node.js / Express) ─────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: worklearn_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      NODE_ENV:           ${NODE_ENV:-development}
      PORT:               ${BACKEND_PORT:-4000}
      DATABASE_URL:       postgresql://${POSTGRES_USER:-worklearn}:${POSTGRES_PASSWORD:-worklearn_secret}@postgres:5432/${POSTGRES_DB:-worklearn}
      REDIS_URL:          redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
      ELASTICSEARCH_URL:  http://elasticsearch:9200
      JWT_SECRET:         ${JWT_SECRET:-change_me_in_production}
      JWT_EXPIRES_IN:     ${JWT_EXPIRES_IN:-7d}
      ANTHROPIC_API_KEY:  ${ANTHROPIC_API_KEY}
      MINIO_ENDPOINT:     minio
      MINIO_PORT:         9000
      MINIO_ACCESS_KEY:   ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY:   ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET:       ${MINIO_BUCKET:-worklearn}
      FPAY_MERCHANT_ID:   ${FPAY_MERCHANT_ID}
      FPAY_SECRET_KEY:    ${FPAY_SECRET_KEY}
      FPAY_API_URL:       ${FPAY_API_URL:-https://api.foxpay.vn/v1}
      CORS_ORIGIN:        ${CORS_ORIGIN:-http://localhost:3000}
      EMAIL_HOST:         ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_USER:         ${EMAIL_USER}
      EMAIL_PASS:         ${EMAIL_PASS}
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    volumes:
      - ./backend/src:/app/src:ro
    command: npm run dev

  # ── Frontend (React + Vite) ──────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: worklearn_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL:           ${VITE_API_URL:-http://localhost:4000/api/v1}
      VITE_WS_URL:            ${VITE_WS_URL:-ws://localhost:4000}
      VITE_ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      VITE_MINIO_PUBLIC_URL:  ${VITE_MINIO_PUBLIC_URL:-http://localhost:9000/worklearn}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend/src:/app/src:ro

  # ── Nginx Reverse Proxy ──────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: worklearn_nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro

volumes:
  postgres_data:
  redis_data:
  es_data:
  minio_data:

networks:
  default:
    name: worklearn_network
