worker_processes auto;
worker_rlimit_nofile 65535;

events {
  worker_connections 4096;
  use epoll;
  multi_accept on;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  charset       utf-8;
  server_tokens off;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" $request_time';
  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log warn;

  sendfile on; tcp_nopush on; tcp_nodelay on;
  keepalive_timeout 75; keepalive_requests 1000;
  client_max_body_size 500M;

  gzip on; gzip_comp_level 5; gzip_min_length 256; gzip_proxied any; gzip_vary on;
  gzip_types application/json application/javascript text/plain text/css text/javascript image/svg+xml;

  limit_req_zone $binary_remote_addr zone=api:20m    rate=60r/m;
  limit_req_zone $binary_remote_addr zone=auth:10m   rate=10r/m;
  limit_req_zone $binary_remote_addr zone=ai:10m     rate=20r/m;
  limit_req_zone $binary_remote_addr zone=upload:10m rate=5r/m;
  limit_conn_zone $binary_remote_addr zone=perip:10m;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:20m;
  ssl_session_timeout 1d;
  ssl_stapling on;
  ssl_stapling_verify on;

  upstream backend  { server backend:4000;  keepalive 64; }
  upstream frontend { server frontend:80;   keepalive 32; }

  # HTTP -> HTTPS
  server {
    listen 80; listen [::]:80;
    server_name career.jockerow.com www.career.jockerow.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
  }

  # HTTPS main
  server {
    listen 443 ssl http2; listen [::]:443 ssl http2;
    server_name career.jockerow.com www.career.jockerow.com;

    ssl_certificate     /etc/letsencrypt/live/career.jockerow.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/career.jockerow.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options         SAMEORIGIN always;
    add_header X-Content-Type-Options  nosniff always;
    add_header X-XSS-Protection        "1; mode=block" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    limit_conn perip 50;

    location /api/ {
      limit_req zone=api burst=30 nodelay;
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 120s;
    }

    location /api/v1/auth/ {
      limit_req zone=auth burst=5 nodelay;
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/ai/ {
      limit_req zone=ai burst=10 nodelay;
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 180s;
      proxy_buffering off;
    }

    location ~ ^/api/v1/ai/score-stream/ {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_set_header Host $host;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 35s;
      add_header X-Accel-Buffering no;
    }

    location ~ ^/api/v1/(users/cv|users/avatar|courses/.*/lessons|courses/.*/thumbnail) {
      limit_req zone=upload burst=3 nodelay;
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_read_timeout 300s;
      client_max_body_size 500M;
    }

    location /webhooks/ {
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 30s;
    }

    location / {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_cache_bypass $http_upgrade;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
      proxy_pass http://frontend;
      expires 1y;
      add_header Cache-Control "public, immutable";
      access_log off;
    }

    location /api/v1/health { proxy_pass http://backend; access_log off; }
  }
}
