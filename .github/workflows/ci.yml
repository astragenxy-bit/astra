name: WorkLearn CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Backend Tests ─────────────────────────────────────────────
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB:       worklearn_test
          POSTGRES_USER:     worklearn
          POSTGRES_PASSWORD: test_secret
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["5432:5432"]
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: backend/package-lock.json }
      - name: Install dependencies
        run:  cd backend && npm ci
      - name: Run migrations
        run:  |
          cd backend
          for f in database/migrations/*.sql; do
            PGPASSWORD=test_secret psql -h localhost -U worklearn -d worklearn_test -f "$f"
          done
        env: { DATABASE_URL: postgresql://worklearn:test_secret@localhost:5432/worklearn_test }
      - name: Run tests
        run:  cd backend && npm test
        env:
          NODE_ENV:       test
          DATABASE_URL:   postgresql://worklearn:test_secret@localhost:5432/worklearn_test
          REDIS_URL:      redis://localhost:6379
          JWT_SECRET:     test_jwt_secret

  # ── Frontend Build ────────────────────────────────────────────
  build-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: frontend/package-lock.json }
      - name: Install dependencies
        run:  cd frontend && npm ci
      - name: Build
        run:  cd frontend && npm run build
        env:
          VITE_API_URL: /api/v1

  # ── Deploy (main branch only) ─────────────────────────────────
  deploy:
    name: Deploy to Production
    needs: [test-backend, build-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host:     ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key:      ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/worklearn
            git pull origin main
            docker compose pull
            docker compose up -d --build --no-deps backend frontend
            docker compose exec backend node database/migrations/run.js
            echo "✅ Deployed WorkLearn $(date)"
